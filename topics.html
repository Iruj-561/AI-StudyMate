<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Syllabus Topics — AI StudyMate</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app-layout">
    <script>document.write(renderSidebar('topics.html'))</script>

    <main class="main-content">
      <header class="page-header">
        <h1>Syllabus Topics</h1>
        <p>Cambridge Mathematics 9709 — browse all papers and topics</p>
      </header>

      <div class="page-body">
        <div class="tabs" id="paper-tabs"></div>
        <div class="filter-bar">
          <input type="search" class="search-input" id="topic-search" placeholder="Search topics...">
        </div>
        <div class="grid-3" id="topics-grid"></div>
      </div>
    </main>
  </div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    let activePaper = 'all';

    function renderTabs() {
      const tabs = document.getElementById('paper-tabs');
      const items = [{ id: 'all', label: 'All Papers' }, ...SYLLABUS.papers.map(p => ({ id: p.id, label: p.code }))];
      tabs.innerHTML = items.map(item => `
        <button class="tab ${item.id === activePaper ? 'active' : ''}" data-paper="${item.id}">${item.label}</button>
      `).join('');

      tabs.querySelectorAll('.tab').forEach(tab => {
        tab.addEventListener('click', () => {
          activePaper = tab.dataset.paper;
          renderTabs();
          renderTopics();
        });
      });
    }

    function renderTopics() {
      const search = document.getElementById('topic-search').value.toLowerCase();
      const grid = document.getElementById('topics-grid');

      let papers = activePaper === 'all' ? SYLLABUS.papers : SYLLABUS.papers.filter(p => p.id === activePaper);

      const cards = papers.flatMap(paper =>
        paper.topics
          .filter(t => t.name.toLowerCase().includes(search))
          .map(topic => `
            <div class="card topic-card" style="--topic-color:${paper.color}" onclick="location.href='practice.html?topic=${topic.id}'">
              <div class="topic-icon" style="background:${paper.color}22">${paper.icon}</div>
              <div class="badge badge-muted" style="margin-bottom:0.5rem">${paper.code}</div>
              <h3>${topic.name}</h3>
              <p>${topic.questions} practice questions available</p>
              <div class="progress-label">
                <span>Mastery</span>
                <span style="color:${getMasteryColor(topic.mastery)}">${topic.mastery}%</span>
              </div>
              <div class="progress-bar">
                <div class="progress-fill" data-width="${topic.mastery}%" style="width:${topic.mastery}%;background:${paper.color}"></div>
              </div>
              <div class="topic-meta" style="margin-top:1rem">
                <span>✏️ Practice</span>
                <span>⚡ Quiz</span>
                <span>🤖 Ask AI</span>
              </div>
            </div>
          `)
      );

      grid.innerHTML = cards.length ? cards.join('') : '<p class="text-muted">No topics found.</p>';
      animateProgressBars();
    }

    document.addEventListener('DOMContentLoaded', () => {
      renderTabs();
      renderTopics();
      document.getElementById('topic-search').addEventListener('input', renderTopics);
    });
  </script>
</body>
</html>
